name: Monitor Madonna Store Stock

on:
  push:
    branches:
      - main

  schedule:
    - cron: '7,22,37,52 * * * *'

  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Mostra tipo di evento
        run: |
          echo "Tipo evento: ${{ github.event_name }}"
          echo "Data e ora UTC:"
          date -u

      - name: Test
        run: echo "Workflow avviato!"
