name: Check Madonna LP Stock

on:
  schedule:
    # Esegue il controllo ogni 5 minuti
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permette di avviarlo manualmente per testare

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Stock Check
        run: python bot.py
